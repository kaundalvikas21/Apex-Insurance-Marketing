# Preview hosting. See DEPLOY.md for the click-through and for what to undo at launch.
#
# Nothing is generated at deploy time: every .html, assets/site.css and image is
# committed. The "build" is tools/stage.py copying the site surface into dist/, so
# public/, tools/, design-system/ and every .md stay out of the deploy.

[build]
  command = "python3 tools/stage.py"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Basic auth on everything. Set PREVIEW_USER and PREVIEW_PASSWORD in the Netlify UI.
[[edge_functions]]
  function = "preview-auth"
  path = "/*"
